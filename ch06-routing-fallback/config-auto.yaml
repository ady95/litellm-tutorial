# 06-4. LiteLLM 내장 난이도 라우터 (complexity_router, 베타)
model_list:
  - model_name: local
    litellm_params:
      model: hosted_vllm/qwen3.5-9b
      api_base: os.environ/VLLM_API_BASE
      reasoning_effort: none
    model_info:              # 라우터가 출력 토큰 한도를 알 수 있게 명시 (없으면 400 오류)
      max_input_tokens: 16384
      max_output_tokens: 4096
  # 같은 로컬 서버, Fallback 없음: 정책 엔진(policy_engine.py)이 민감정보 요청을 보내는 곳
  - model_name: local-private
    litellm_params:
      model: hosted_vllm/qwen3.5-9b
      api_base: os.environ/VLLM_API_BASE
      reasoning_effort: none
  - model_name: fast
    litellm_params:
      model: openai/gpt-6-luna
      api_key: os.environ/OPENAI_API_KEY
  - model_name: smart
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: auto
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_config:
        tiers:
          SIMPLE: local
          MEDIUM: fast
          COMPLEX: smart
          REASONING: smart
      complexity_router_default_model: fast

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
