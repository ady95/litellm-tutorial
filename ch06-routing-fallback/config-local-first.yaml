# 06-5. 로컬 우선, 장애 시 클라우드로
model_list:
  - model_name: local
    litellm_params:
      model: hosted_vllm/qwen3.5-9b
      api_base: os.environ/VLLM_API_BASE
      reasoning_effort: none
      timeout: 10              # 로컬 서버가 응답하지 않으면 10초 만에 포기
  # 같은 로컬 서버, 하지만 Fallback 없음
  # 민감정보 요청 전용 (외부로 절대 넘기지 않음)
  - model_name: local-private
    litellm_params:
      model: hosted_vllm/qwen3.5-9b
      api_base: os.environ/VLLM_API_BASE
      reasoning_effort: none
      timeout: 10
  - model_name: fast
    litellm_params:
      model: openai/gpt-6-luna
      api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  drop_params: true

router_settings:
  num_retries: 1
  retry_policy:
    InternalServerErrorRetries: 0
    TimeoutErrorRetries: 0
  fallbacks:
    - local: [fast]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
