model_list:
  # 로컬 모델
  - model_name: local-small          # CPU에서도 도는 소형 모델 (Ollama)
    litellm_params:
      model: ollama_chat/qwen3.5:2b
      api_base: os.environ/OLLAMA_API_BASE
      reasoning_effort: none
  - model_name: local                # GPU 서버의 9B 모델 (vLLM)
    litellm_params:
      model: hosted_vllm/qwen3.5-9b
      api_base: os.environ/VLLM_API_BASE
      reasoning_effort: none
  # 클라우드 모델 (4장과 같음)
  - model_name: fast
    litellm_params:
      model: openai/gpt-6-luna
      api_key: os.environ/OPENAI_API_KEY
  - model_name: smart
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 60

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
